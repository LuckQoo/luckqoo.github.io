<script>
(function () {
	var locked = document.getElementById('chat-locked');
	var signedInArea = document.getElementById('chat-signed-in-area');
	var lockedCta = document.getElementById('chat-locked-cta');

	var live2dLoaded = false;
	function ensureLive2d() {
		if (live2dLoaded) return;
		live2dLoaded = true;
		var scripts = [
			'assets/vendor/pixi.min.js',
			'assets/vendor/live2dcubismcore.min.js',
			'assets/vendor/pixi-live2d-cubism4.min.js',
			'assets/vendor/pixi-live2d-display.min.js',
			'assets/js/live2d-boy.js',
		];
		var i = 0;
		function loadNext() {
			if (i >= scripts.length) return;
			var s = document.createElement('script');
			s.src = scripts[i++];
			s.onload = loadNext;
			document.body.appendChild(s);
		}
		loadNext();
	}

	function applyAuthState(detail) {
		if (detail.error || detail.unconfigured) {
			lockedCta.textContent = '登入服務暫時無法使用，請稍後再試';
			lockedCta.removeAttribute('href');
		}
		if (detail.signedIn) {
			locked.style.display = 'none';
			signedInArea.style.display = '';
			ensureLive2d();
		} else {
			locked.style.display = '';
			signedInArea.style.display = 'none';
		}
	}

	document.addEventListener('epoch-auth-ready', function (e) {
		applyAuthState(e.detail);
	});

	lockedCta.addEventListener('click', function (e) {
		e.preventDefault();
		if (window.Clerk) {
			window.Clerk.openSignIn({});
		} else {
			lockedCta.textContent = '登入功能尚未開放，請稍後再試';
			lockedCta.style.pointerEvents = 'none';
			lockedCta.style.opacity = '0.6';
		}
	});
})();
</script>
<script>
(function () {
	var form = document.getElementById('chat-form');
	var input = document.getElementById('chat-input');
	var sendBtn = document.getElementById('chat-send');
	var messages = document.getElementById('chat-messages');
	var searchToggle = document.getElementById('chat-search-toggle');
	var history = [];
	var searchEnabled = false;

	searchToggle.addEventListener('click', function () {
		searchEnabled = !searchEnabled;
		searchToggle.textContent = searchEnabled ? '🔍 搜尋本站：開' : '🔍 搜尋本站：關';
		searchToggle.classList.toggle('active', searchEnabled);
	});

	function apiUrl(path) {
		var base = window.EPOCH_API_BASE_URL || '';
		return base + path;
	}

	// Enter 送出、Shift+Enter 換行（textarea 預設 Enter 只會換行，要自己接管）。
	input.addEventListener('keydown', function (e) {
		if (e.key === 'Enter' && !e.shiftKey) {
			e.preventDefault();
			if (typeof form.requestSubmit === 'function') {
				form.requestSubmit();
			} else {
				form.dispatchEvent(new Event('submit', { cancelable: true }));
			}
		}
	});

	function appendMessage(role, text, withUpgradeLink) {
		var wrapper = document.createElement('div');
		wrapper.className = 'epoch-ai-chat-msg epoch-ai-chat-msg--' + role;
		var bubble = document.createElement('div');
		bubble.className = 'epoch-ai-chat-bubble';
		bubble.textContent = text;
		wrapper.appendChild(bubble);
		messages.appendChild(wrapper);

		if (withUpgradeLink) {
			var link = document.createElement('a');
			link.href = 'pricing.html';
			link.className = 'epoch-ai-chat-cta';
			link.style.marginTop = '6px';
			link.style.display = 'inline-block';
			link.textContent = '查看訂閱方案 / View plans';
			var linkWrap = document.createElement('div');
			linkWrap.className = 'epoch-ai-chat-msg epoch-ai-chat-msg--assistant';
			linkWrap.appendChild(link);
			messages.appendChild(linkWrap);
		}

		messages.scrollTop = messages.scrollHeight;
	}

	form.addEventListener('submit', async function (e) {
		e.preventDefault();
		var text = input.value.trim();
		if (!text || !window.Clerk || !window.Clerk.session) return;

		input.value = '';
		sendBtn.disabled = true;
		appendMessage('user', text);

		try {
			var token = await window.Clerk.session.getToken();
			var res = await fetch(apiUrl('/api/chat'), {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json',
					'Authorization': 'Bearer ' + token,
				},
				body: JSON.stringify({ message: text, history: history, enableSearch: searchEnabled }),
			});

			if (res.status === 403) {
				appendMessage('assistant', '請先訂閱方案才能收到 AI 回覆，訂閱後即可立即開始對話。', true);
				return;
			}
			if (res.status === 429) {
				var limitInfo = await res.json().catch(function () { return {}; });
				appendMessage('assistant', limitInfo.error === 'service_daily_limit_exceeded'
					? '目前服務已達今日對話上限，請稍後再試。'
					: '今天的免費對話額度已經用完了，明天會自動重置，感謝你的耐心！');
				return;
			}
			if (!res.ok) {
				appendMessage('assistant', '發生錯誤，請稍後再試。');
				return;
			}

			var data = await res.json();
			history.push({ role: 'user', content: text });
			history.push({ role: 'assistant', content: data.reply });
			appendMessage('assistant', data.reply);
		} catch (err) {
			console.error('[epoch-ai-chat] chat request failed', err);
			appendMessage('assistant', '無法連線至 AI 服務，請稍後再試。');
		} finally {
			sendBtn.disabled = false;
		}
	});
})();
</script>
