  <style>
    #payment-form { max-width: 520px; margin: 1.5rem auto 0; }

    .card-fields { display: grid; gap: .75rem; margin-top: 1rem; text-align: left; }
    .card-fields label { display: grid; gap: .35rem; }
    .card-fields input { box-sizing: border-box; width: 100%; min-height: 46px; padding: .7rem .8rem; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; font: inherit; }
    .card-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    @media (max-width: 560px) { .card-field-row { grid-template-columns: 1fr; } }
    .hidden { display: none; }
  </style>
</head>
