  <style>
    #payment-form { max-width: 420px; margin: 1.5rem auto 0; }
    #payment-element { margin: 1rem 0; }
    #payment-form button#submit {
      width: 100%;
      background: linear-gradient(90deg, #21d46a, #74ffab);
      color: #04260f;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    #payment-message {
      margin-top: 0.8rem;
      color: var(--danger);
      text-align: center;
    }
    #payment-message.success { color: var(--accent); }
    .hidden { display: none; }
    #spinner {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: 2px solid rgba(4, 38, 15, 0.4);
      border-top-color: #04260f;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="bg-mask"></div>

  <header class="site-header">
    <nav class="nav-wrap">
      <a class="brand-link" href="../index.html">EPOCH SHOP</a>

      <a class="coffee-btn" href="https://www.buymeacoffee.com/haastyu" target="_blank" rel="noopener"><img src="https://img.buymeacoffee.com/button-api/?text=Buy me a Coffee&emoji=☕&slug=haastyu&button_colour=FFDD00&font_colour=000000&font_family=Cookie&outline_colour=000000&coffee_colour=ffffff" alt="Buy me a coffee" /></a>

      <div id="checkout-cart-summary" style="max-width: 420px; margin: 1rem auto 0; text-align: left;"></div>

      <form id="payment-form">
        <div id="payment-element">
