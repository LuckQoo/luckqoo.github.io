<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=products.html" />
  <script>localStorage.removeItem("epoch_shop_cart"); window.location.replace("products.html");</script>
  <title>安全結帳 | EPOCH SHOP LLC</title>
  <link rel="icon" href="/eshop.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css?v=3" />
  <style>
    #payment-form { max-width: 520px; margin: 1.5rem auto 0; }
    #payment-form #submit { width: 100%; }
    #payment-form #submit:disabled { cursor: not-allowed; opacity: 0.55; }
    #payment-message { margin-top: 0.8rem; text-align: center; }
    #payment-message.success { color: var(--accent); }
    .card-fields { display: grid; gap: .75rem; margin-top: 1rem; text-align: left; }
    .card-fields[hidden] { display: none; }
    .card-fields label { display: grid; gap: .35rem; }
    .paypal-card-field { min-height: 46px; padding: 0 .75rem; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; background: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="bg-mask"></div>
  <header class="site-header">
    <nav class="nav-wrap">
      <a class="brand-link" href="../index.html">EPOCH SHOP</a>
      <a class="menu-btn" href="../index.html">首頁</a>
      <a class="menu-btn" href="products.html">虛擬模型</a>
      <a class="menu-btn" href="software.html">軟體 / 應用</a>
      <a class="menu-btn" href="hosting.html">虛擬主機</a>
      <a class="menu-btn" href="contact.html">聯絡我們</a>
    </nav>
  </header>
  <main>
    <section class="hero" style="text-align:center;">
      <h1 class="cyber-title">安全結帳</h1>
      <p class="subtitle">請確認訂單內容並閱讀相關政策。付款將透過安全付款頁面完成。</p>
      <div id="checkout-cart-summary" class="card" style="max-width:520px;margin:1rem auto 0;text-align:left;"></div>
      <form id="payment-form">
        <label class="checkout-consent">
          <input type="checkbox" id="policy-consent" />
          <span>我已閱讀並同意 <a href="terms.html" target="_blank">服務條款</a>、<a href="privacy.html" target="_blank">隱私政策</a>、<a href="refund.html" target="_blank">退款政策</a>及<a href="delivery.html" target="_blank">交付政策</a>。</span>
        </label>
        <div id="paypal-card-fields" class="card-fields" hidden>
          <label>持卡人姓名<div id="card-name-field-container" class="paypal-card-field"></div></label>
          <label>卡號<div id="card-number-field-container" class="paypal-card-field"></div></label>
          <label>有效期限<div id="card-expiry-field-container" class="paypal-card-field"></div></label>
          <label>安全碼<div id="card-cvv-field-container" class="paypal-card-field"></div></label>
        </div>
        <button id="submit" class="button primary" type="submit" disabled>使用信用卡／簽帳卡付款</button>
        <div id="payment-message" class="subtitle"></div>
      </form>
    </section>
  </main>

  <script src="../js/matrix.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/checkout.js?v=7"></script>

</html>
