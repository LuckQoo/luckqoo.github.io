<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>付款待確認 | EPOCH SHOP</title>
  <link rel="icon" href="/eshop.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css?v=2" />
  <style>
    .pending-card {
      max-width: 560px;
      margin: 1.5rem auto 0;
      padding: 2rem;
      border: 1px solid rgba(44, 255, 124, 0.28);
      border-radius: 18px;
      background: rgba(3, 18, 11, 0.82);
      text-align: center;
    }
    .pending-icon {
      display: grid;
      place-items: center;
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1rem;
      border: 2px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 800;
    }
    .pending-card p { line-height: 1.8; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="bg-mask"></div>

  <header class="site-header">
    <nav class="nav-wrap">
      <a class="brand-link" href="../index.html">EPOCH SHOP</a>
      <a class="menu-btn" href="../index.html">首頁</a>
      <a class="menu-btn" href="products.html">服務項目</a>
      <a class="menu-btn" href="hosting.html">虛擬主機</a>
      <a class="menu-btn" href="cart.html">購物車（<span data-cart-count>0</span>）</a>
      <a class="menu-btn" href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="hero" style="text-align:center;">
      <h1 class="cyber-title">付款待確認</h1>
      <div class="pending-card">
        <div class="pending-icon" aria-hidden="true">…</div>
        <h2>我們正在等待付款結果</h2>
        <p>
          ATM 或場外交易（OTC）付款可能需要一些時間才能確認。請保留付款指示，
          並在期限內完成付款；Paddle 確認後會依你提供的聯絡方式通知你。
        </p>
        <p><a class="button primary" href="../index.html">返回 EPOCH SHOP</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">© <span id="year"></span> EPOCH SHOP<br />Business Address: 30 N Gould St Ste R, Sheridan, WY 82801, United States<br />Contact Phone: +1 (307) 204-5345</footer>

  <script src="../js/matrix.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
