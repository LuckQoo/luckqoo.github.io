</head>
<body>

  <div class="bg-mask"></div>

  <header class="site-header">
    <nav class="nav-wrap">
      <a class="brand-link" href="../index.html">EPOCH SHOP</a>
      <a class="menu-btn" href="../index.html">首頁</a>
      <a class="menu-btn" href="products.html">虛擬模型</a>
      <a class="menu-btn" href="software.html">軟體 / 應用</a>
      <a class="menu-btn" href="hosting.html">虛擬主機</a>
      <a class="menu-btn" href="https://epoch-shop.com" target="_blank" rel="noopener">AI Chat</a>
      <a class="menu-btn active" href="cart.html">購物車（<span data-cart-count>0</span>）</a>
      <a class="menu-btn" href="https://tw.shp.ee/Gb6D24X" target="_blank" rel="noopener">生活小品</a>
      <a class="coffee-btn" href="https://www.buymeacoffee.com/haastyu" target="_blank" rel="noopener"><img src="https://img.buymeacoffee.com/button-api/?text=Buy me a Coffee&emoji=☕&slug=haastyu&button_colour=FFDD00&font_colour=000000&font_family=Cookie&outline_colour=000000&coffee_colour=ffffff" alt="Buy me a coffee" /></a>
      <a class="menu-btn" href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>購物車</h1>
      <div id="cart-list" class="card"></div>
      <p class="price" id="cart-total">總計：$0</p>
      <p id="cart-mixed-warning" class="subtitle hidden" style="color: var(--danger);">
        購物車裡同時有一次性商品和訂閱制主機，兩者的付款週期不同，請分開結帳。
      </p>
      <div class="actions">
        <button class="ghost" id="clear-cart">清空購物車</button>
        <a class="button primary" href="checkout.html" id="go-checkout">前往結帳</a>
      </div>
    </section>
  </main>

    <footer class="site-footer">© <span id="year"></span> EPOCH SHOP LLC<br />Business Address: 30 N Gould St Ste R, Sheridan, WY 82801, United States<br />Contact: <a href="mailto:yukine@diary-city.com">yukine@diary-city.com</a> · <a href="tel:+13073037141">+1 (307) 303-7141</a><div class="footer-links"><a href="terms.html">服務條款</a><a href="privacy.html">隱私政策</a><a href="refund.html">退款政策</a><a href="delivery.html">交付政策</a></div></footer>

  <script src="../js/matrix.js"></script>
  <script src="../js/site.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    function renderCart() {
      const list = document.getElementById("cart-list");
      const items = window.cartApi.getCart();
      if (!items.length) {
        list.innerHTML = "<p class='subtitle'>目前購物車沒有商品。</p>";
      } else {
        list.innerHTML = items.map((item) => `
          <div class="cart-row">
            <div>${item.name} x ${item.qty}</div>
            <div>$${item.price * item.qty}${item.recurring ? "/月" : ""}</div>
            <button class="ghost" data-remove="${item.id}">移除</button>
          </div>
        `).join("");
      }
      document.getElementById("cart-total").textContent = `總計：$${window.cartApi.cartTotal()}`;

      const mixed = window.cartApi.hasMixedCart();
      document.getElementById("cart-mixed-warning").classList.toggle("hidden", !mixed);
      document.getElementById("go-checkout").classList.toggle("hidden", mixed);

      document.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.onclick = () => {
          window.cartApi.removeFromCart(btn.dataset.remove);
          renderCart();
        };
      });
    }

    document.getElementById("clear-cart").addEventListener("click", () => {
      window.cartApi.clearCart();
      renderCart();
    });

    renderCart();
  </script>

  <script src="../assets/jquery.min.js?v=3.3.1"></script>
  <script src="../assets/jquery-ui.min.js?v=1.12.1"></script>
</body>
</html>
