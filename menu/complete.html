  <style>
    #payment-status { max-width: 420px; margin: 1.5rem auto 0; text-align: center; }
    #status-icon {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      margin: 0 auto 0.8rem;
    }
    #status-icon.status-ok { background: var(--accent); }
    #status-icon.status-error { background: var(--danger); }
    #details-table { margin-top: 1.2rem; text-align: left; }
    #details-table table { width: 100%; border-collapse: collapse; }
    #details-table td { padding: 0.5rem 0.3rem; border-bottom: 1px solid rgba(44, 255, 124, 0.2); word-break: break-all; }
    #details-table td:first-child { color: var(--muted); white-space: nowrap; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

    <section class="hero" style="text-align:center;">

      <div id="payment-status">

        <p id="status-text">查詢中...</p>

        <div id="details-table">
          <table>
            <tbody>
              <tr>
                <td id="intent-label">ID</td>
                <td id="intent-id">-</td>
              </tr>
              <tr id="intent-status-row">
