<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交易已送出 | EPOCH SHOP</title>
  <link rel="icon" href="/eshop.ico" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css?v=2" />
  <style>
    .result-card { max-width: 560px; margin: 1.5rem auto 0; padding: 2rem; border: 1px solid rgba(44,255,124,.28); border-radius: 18px; background: rgba(3,18,11,.82); text-align: center; }
    .result-card dl { display: grid; grid-template-columns: max-content 1fr; gap: .7rem 1rem; margin: 1.5rem 0; text-align: left; }
    .result-card dt { color: var(--muted); }
    .result-card dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas><div class="bg-mask"></div>
  <header class="site-header"><nav class="nav-wrap"><a class="brand-link" href="../index.html">EPOCH SHOP</a><a class="menu-btn" href="../index.html">首頁</a><a class="menu-btn" href="products.html">服務項目</a><a class="menu-btn" href="contact.html">聯絡我們</a></nav></header>
  <main><section class="hero" style="text-align:center;">
    <h1 class="cyber-title">交易已送出</h1>
    <div class="result-card">
      <h2>感謝你的訂購</h2>
      <p>頁面跳轉只代表付款流程已結束；最終結果會由 Codapay 的伺服器通知確認。</p>
      <dl><dt>交易編號</dt><dd data-codapay-txn>讀取中…</dd><dt>訂單編號</dt><dd data-codapay-order>讀取中…</dd></dl>
      <a class="button primary" href="../index.html">返回 EPOCH SHOP</a>
    </div>
  </section></main>
  <footer class="site-footer">© <span id="year"></span> EPOCH SHOP</footer>
  <script src="../js/matrix.js"></script><script src="../js/site.js"></script><script src="../js/codapay-landing.js"></script>
</body>
</html>
